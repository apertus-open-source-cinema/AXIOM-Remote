name: Build, Test, and Deploy

on:
  push:
    branches-ignore: ["gh-pages"]
  pull_request:
    branches-ignore: ["gh-pages"]

jobs:
  build-firmware:
    name: Build Firmware
    runs-on: ubuntu-latest
    container: bandit1983/gcc-arm-toolchain

    steps:
      - uses: actions/checkout@v4

      - name: Build firmware
        run: |
          cd Firmware
          cmake -B build -G Ninja .
          cmake --build build

      - name: Prepare firmware artifacts
        run: |
          cd Firmware/build
          for f in *.hex *.uf2; do
            mv "$f" "${f%.*}_${{ github.run_number }}.${f##*.}"
            md5sum "${f%.*}_${{ github.run_number }}.${f##*.}" > "${f%.*}_${{ github.run_number }}.${f##*.}.md5"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: Firmware/build/*

