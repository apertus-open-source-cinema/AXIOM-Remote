  build-3d:
    name: Build 3D Visualizer
    runs-on: ubuntu-latest
    needs: build-firmware


    defaults:
      run:
        working-directory: AXIOM_Remote_3D_Visualizer

    steps:
      - uses: actions/checkout@v4

      - name: Fetch LVGL source dependency
        run: |
          mkdir -p ../Firmware/3rdParty
          git clone --depth 1 --branch master https://github.com/lvgl/lvgl.git ../Firmware/3rdParty/lvgl-src

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: mymindstorm/setup-emsdk@v14

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: |
          ./transpile_firmware.sh
          pnpm build

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: AXIOM_Remote_3D_Visualizer/dist

  deploy-gh-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-3d
    if: github.event_name == 'push'

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
